<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #f1f5f9;
      }

      /* Animations */
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.95; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes waveScan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .pulse-orb1 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .pulse-orb2 {
        animation: pulseGlow 10s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .floating-card-3 {
        animation: floatSlow 5.5s ease-in-out infinite 1s;
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: dashAnim 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs (Kept behind content) -->
  <g opacity="0.6">
    <circle class="pulse-orb1" cx="240" cy="110" r="180" fill="url(#glowGrad1)" filter="url(#glow)" />
    <circle class="pulse-orb2" cx="960" cy="280" r="220" fill="url(#glowGrad2)" filter="url(#glow)" />
  </g>

  <!-- Dynamic Data Flow Line in Background -->
  <g opacity="0.35">
    <path class="flow-path" d="M 50 350 C 250 310, 350 380, 600 340 C 850 300, 950 370, 1150 330" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path" d="M 50 80 C 300 120, 500 50, 750 90 C 1000 130, 1100 60, 1150 70" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Side Floating Interactive Metric Cards -->
  <!-- Card 1: Ticket Resolved -->
  <g class="floating-card-1" transform="translate(80, 48)">
    <rect width="170" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="37" r="14" fill="#059669" fill-opacity="0.2" />
    <path d="M 24 37 L 28 41 L 36 32" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="32" class="metric-title">Avg SLA Response</text>
    <text x="56" y="55" class="metric-val">&lt; 12 mins</text>
  </g>

  <!-- Card 2: Omnichannel Live Hub -->
  <g class="floating-card-2" transform="translate(950, 48)">
    <rect width="170" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="37" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <path d="M 23 37 A 7 7 0 0 1 37 37 A 7 7 0 0 1 23 37 M 27 41 L 24 45 L 30 43" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linejoin="round" />
    <text x="56" y="32" class="metric-title">Active Channels</text>
    <text x="56" y="55" class="metric-val">Omnichannel</text>
  </g>

  <!-- Card 3: Open Source & Data Sovereignty -->
  <g class="floating-card-3" transform="translate(950, 290)">
    <rect width="170" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="37" r="14" fill="#a855f7" fill-opacity="0.2" />
    <path d="M 30 28 L 37 32 L 37 40 L 30 44 L 23 40 L 23 32 Z" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linejoin="round" />
    <text x="56" y="32" class="metric-title">Self-Hostable</text>
    <text x="56" y="55" class="metric-val">100% Control</text>
  </g>

  <!-- Card 4: Curated Ecosystem -->
  <g class="floating-card-1" transform="translate(80, 290)">
    <rect width="170" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="37" r="14" fill="#f59e0b" fill-opacity="0.2" />
    <polygon points="30,26 33,33 40,34 35,39 36,46 30,42 24,46 25,39 20,34 27,33" fill="#fbbf24" />
    <text x="56" y="32" class="metric-title">Curated Repos</text>
    <text x="56" y="55" class="metric-val">Top Stars</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Main Headline with Gradient -->
    <text y="0" class="title-text" fill="url(#titleGrad)">Awesome Customer Support Ticketing</text>
    
    <!-- Subtitle -->
    <text y="42" class="subtitle-text">Curated Helpdesk Platforms, Shared Inboxes &amp; ITSM Software</text>
    <text y="70" class="subtitle-text" font-size="16" fill="#64748b">Enterprise Cloud SaaS • Data-Sovereign Open Source • AI Agent Automation</text>
    
    <!-- Pill badges -->
    <g transform="translate(0, 105)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(-230, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text y="4" class="pill-text" fill="#38bdf8">☁️ Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" />
        <text y="4" class="pill-text" fill="#34d399">⚡ Self-Hosted FOSS</text>
      </g>
      <!-- Pill 3: Shared Inbox -->
      <g transform="translate(85, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
        <text y="4" class="pill-text" fill="#c084fc">📬 Shared Inboxes</text>
      </g>
      <!-- Pill 4: AI & SLAs -->
      <g transform="translate(235, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="1" />
        <text y="4" class="pill-text" fill="#f472b6">🤖 AI Triage &amp; SLAs</text>
      </g>
    </g>
  </g>
</svg>
